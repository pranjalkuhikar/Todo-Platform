# Local observability lab: Postgres + Loki (logs) + Prometheus (metrics) + Grafana (UI)
# Apps (Next.js on :3000, Express on :4000) run on your machine, not in Docker.
name: observability-lab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://app:app@postgres:5432/postgres?sslmode=disable
    ports: ["9187:9187"]
    depends_on:
      postgres: { condition: service_healthy }

  # Web UI for Postgres (browse tables and rows). Open http://localhost:8081
  # Login: System=PostgreSQL, Server=postgres, Username=app, Password=app, Database=nextapp (or nodeapp)
  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports: ["127.0.0.1:8081:8080"]   # localhost only
    depends_on:
      postgres: { condition: service_healthy }

  loki:
    image: grafana/loki:3.4.2
    ports: ["3100:3100"]
    volumes: [lokidata:/loki]

  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:11.5.2
    ports: ["3001:3000"]   # 3001 because Next.js uses 3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # local only: no login needed
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [loki, prometheus, postgres]

volumes:
  pgdata:
  lokidata:
  promdata:
  grafanadata:
