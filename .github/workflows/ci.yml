# Save as:  .github/workflows/ci.yml   in  pranjalkuhikar/Todo-Platform
#
# Verified locally on Node 20.20.2:
#   auth-hub    npm ci -> 42 packages, npx next build -> PASSES
#   nextjs-app  npm ci -> 46 packages, npx next build -> PASSES
#   (docker is not available in my sandbox, so the compose job is syntax/config
#    validation only — GitHub's ubuntu runners do have docker)

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    name: docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config -q && echo "compose config OK"

  build:
    name: build · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [auth-hub, nextjs-app]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npx next build
