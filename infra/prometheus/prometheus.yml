global:
  scrape_interval: 5s
scrape_configs:
  - job_name: nextjs
    metrics_path: /api/metrics
    static_configs: [{ targets: ["host.docker.internal:3000"] }]
  - job_name: express
    metrics_path: /metrics
    static_configs: [{ targets: ["host.docker.internal:4000"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  # microservices-app (published on localhost by its docker-compose.yml)
  - job_name: gateway
    metrics_path: /metrics
    static_configs: [{ targets: ["host.docker.internal:9100"] }]
  - job_name: todo-service
    metrics_path: /metrics
    static_configs: [{ targets: ["host.docker.internal:4002"] }]
