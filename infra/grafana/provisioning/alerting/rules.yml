apiVersion: 1
# Alert rules, loaded automatically when Grafana starts.
# See them in Grafana: left menu -> Alerting -> Alert rules (folder "Observability alerts").
# States: Normal (fine) -> Pending (condition true, waiting out "for") -> Firing (alert is active).
#
# NOTE: no notification channel (email / Slack) is configured, so a firing alert only shows up inside Grafana.
# To get notified: Alerting -> Contact points -> add Email or Slack, then Notification policies -> use it.
groups:
  - orgId: 1
    name: app-health
    folder: Observability alerts
    interval: 30s
    rules:
      - uid: alert-high-5xx
        title: High server error rate (5xx)
        condition: C
        for: 1m
        noDataState: OK          # no 5xx series at all = no errors = fine
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(rate(http_requests_total{status=~"5.."}[1m]))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0.1] } }]
        annotations:
          summary: "More than 0.1 server errors per second for 1 minute"
          what_to_do: "Open Grafana -> Explore -> Loki and run {app=~\".+\", level=\"error\"} to see the errors."
        labels: { severity: critical }

      - uid: alert-high-latency
        title: Slow requests (p95 over 500 ms)
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max(histogram_quantile(0.95, sum by (le, app) (rate(http_request_duration_seconds_bucket[2m]))))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0.5] } }]
        annotations:
          summary: "95% of requests take longer than 0.5 seconds"
          what_to_do: "Check the Postgres dashboard (connections, active queries), then CPU/memory panels."
        labels: { severity: warning }

      - uid: alert-nextjs-down
        title: Next.js app is DOWN
        condition: C
        for: 1m
        noDataState: Alerting    # target missing entirely = treat as down
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'min(up{job="nextjs"})' }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [1] } }]
        annotations:
          summary: "Prometheus cannot reach the Next.js app on port 3000"
          what_to_do: "Is `npm run dev` / `npm start` running in nextjs-app? Check its terminal for errors."
        labels: { severity: critical }

      - uid: alert-postgres-down
        title: Postgres is DOWN
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: "min(pg_up)" }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [1] } }]
        annotations:
          summary: "The database is unreachable, so every app that saves data will fail"
          what_to_do: "Run `docker compose ps` in the Testing folder and `docker compose logs postgres`."
        labels: { severity: critical }
