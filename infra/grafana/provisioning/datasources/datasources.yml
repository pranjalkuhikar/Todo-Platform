apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: Postgres (nextapp)
    uid: pg-nextapp
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: app
    jsonData: { database: nextapp, sslmode: disable, postgresVersion: 1700 }
    secureJsonData: { password: app }
  - name: Postgres (nodeapp)
    uid: pg-nodeapp
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: app
    jsonData: { database: nodeapp, sslmode: disable, postgresVersion: 1700 }
    secureJsonData: { password: app }
